<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1600" height="950" fill="#fbfcfe"/><text x="800.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">FlowForge - durable workflow engine</text><text x="800.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">One task under lease: claim, complete once, recover a crash by lease expiry, else dead-letter.</text><rect x="48" y="150" width="1504" height="300" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="66" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#17509f">TASK LIFECYCLE - LEASE-BASED RECOVERY</text><rect x="150" y="214" width="200" height="88" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(166,229) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="196" y="245" font-size="16.5" font-weight="700" fill="#17509f">PENDING</text><text x="167" y="267.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">queued, unowned</text><text x="167" y="284.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">any worker may claim</text><rect x="600" y="214" width="200" height="88" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(616,229) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="646" y="245" font-size="16.5" font-weight="700" fill="#8c5a0d">LEASED</text><text x="617" y="267.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">owned for lease window</text><text x="617" y="284.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">claim bumps attempt</text><rect x="1050" y="178" width="210" height="88" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1066,193) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="1096" y="209" font-size="16.5" font-weight="700" fill="#186547">COMPLETED</text><text x="1067" y="231.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">effect recorded once</text><text x="1067" y="248.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">key cached for dupes</text><rect x="1050" y="330" width="210" height="88" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1066,345) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5"/><path d="M12 17.2v.1"/></g><text x="1096" y="361" font-size="16.5" font-weight="700" fill="#9e2b36">DEAD_LETTER</text><text x="1067" y="383.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">retry budget spent</text><text x="1067" y="400.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">alert and inspect</text><path d="M350,258 L600,258" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="450.024" y="246.0" width="49.952" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="475.0" y="262.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">claim</text><path d="M800,244 L989.0,244.0 Q1000,244 1000.0,233.0 L1000.0,233.0 Q1000,222 1011.0,222.0 L1050,222" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="864.224" y="232.0" width="71.55199999999999" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="900" y="248.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">complete</text><path d="M800,278 L985.0,278.0 Q1000,278 1000.0,293.0 L1000.0,359.0 Q1000,374 1015.0,374.0 L1050,374" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="946.5840000000001" y="288.0" width="106.832" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="1000" y="304.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">no retries left</text><path d="M660,302 L660.0,337.0 Q660,352 645.0,352.0 L295.0,352.0 Q280,352 280.0,337.0 L280,302" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="417.736" y="340.0" width="104.52799999999999" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="470" y="356.44" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">lease expires</text><path d="M720,302 L720.0,379.0 Q720,394 705.0,394.0 L245.0,394.0 Q230,394 230.0,379.0 L230,302" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><rect x="406.03200000000004" y="382.0" width="137.93599999999998" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="475" y="398.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">fail: retry (backoff)</text><rect x="48" y="486" width="1504" height="274" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="66" y="477" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">THE RUNTIME - THE ENGINE OWNS DURABLE STATE</text><rect x="200" y="520" width="250" height="88" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(216,535) scale(0.8750)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="246" y="551" font-size="16.5" font-weight="700" fill="#3d4a63">Client</text><text x="217" y="573.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">submit a workflow</text><text x="217" y="590.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">poll for status</text><rect x="620" y="520" width="320" height="88" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(636,535) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g><text x="666" y="551" font-size="16.5" font-weight="700" fill="#17509f">Engine API</text><text x="637" y="573.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">owns the task lifecycle</text><text x="637" y="590.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">HTTP claim/complete/fail</text><rect x="1050" y="520" width="300" height="88" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1066,535) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="1096" y="551" font-size="16.5" font-weight="700" fill="#552fae">State store</text><text x="1067" y="573.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">tasks, leases, keys</text><text x="1067" y="590.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Postgres / in-mem ref</text><rect x="200" y="650" width="330" height="88" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(216,665) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M2 20c0-3.9 3.1-6.4 7-6.4s7 2.5 7 6.4"/><path d="M16 5.2A3.4 3.4 0 0 1 16 11"/><path d="M18 13.9c2.4.6 4 2.5 4 5.1"/></g><text x="246" y="681" font-size="16.5" font-weight="700" fill="#186547">Worker fleet</text><text x="217" y="703.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">six languages, one contract</text><text x="217" y="720.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">claim -&gt; run -&gt; report</text><rect x="620" y="650" width="320" height="88" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(636,665) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v4a4 4 0 0 0 4 4h8"/><path d="M6 21v-4a4 4 0 0 1 4-4h8"/><path d="M15 8l3 3-3 3"/><path d="M15 14l3 3-3 3"/></g><text x="666" y="681" font-size="16.5" font-weight="700" fill="#136b74">Event log</text><text x="637" y="703.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">partition by workflow_id</text><text x="637" y="720.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">at-least-once backbone</text><rect x="1050" y="650" width="300" height="88" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1066,665) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></g><text x="1096" y="681" font-size="16.5" font-weight="700" fill="#8c5a0d">Operator console</text><text x="1067" y="703.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">polls live task state</text><text x="1067" y="720.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">retries and DLQ view</text><path d="M450,564 L620,564" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><rect x="506.424" y="552.0" width="57.152" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="535.0" y="568.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">submit</text><path d="M940,564 L1050,564" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="962.824" y="552.0" width="64.352" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="995.0" y="568.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">persist</text><path d="M365,650 L365.0,640.0 Q365,630 375.0,630.0 L689.0,630.0 Q700,630 700.0,619.0 L700,608" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="458.856" y="618.0" width="146.28799999999998" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="532" y="634.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">claim / complete / fail</text><path d="M780,608 L780,650" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="722.048" y="617.0" width="115.904" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="780.0" y="633.44" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">append / replay</text><path d="M1200,608 L1200,650" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="1178.624" y="617.0" width="42.751999999999995" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="1200.0" y="633.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">poll</text><rect x="48" y="786" width="728" height="113.6" rx="11" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.4" stroke-opacity="0.8"/><text x="64" y="810" font-size="13.2" font-weight="700" fill="#136b74">Idempotency and backoff</text><text x="64" y="832" font-size="12.4" fill="#136b74" fill-opacity="0.92">idempotency_key = fnv1a_64(workflow_id | task_id | attempt) -&gt; 16 hex.</text><text x="64" y="850.4" font-size="12.4" fill="#136b74" fill-opacity="0.92">A completion with a seen key is a no-op returning the cached result.</text><text x="64" y="868.8" font-size="12.4" fill="#136b74" fill-opacity="0.92">attempt lives in the key: a retry is new; a duplicate delivery collapses.</text><text x="64" y="887.1999999999999" font-size="12.4" fill="#136b74" fill-opacity="0.92">delay_ms = min(200 * 2^(attempt-1), 30000); after 5 attempts -&gt; DLQ.</text><rect x="824" y="786" width="728" height="113.6" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="840" y="810" font-size="13.2" font-weight="700" fill="#186547">Durable and interchangeable</text><text x="840" y="832" font-size="12.4" fill="#186547" fill-opacity="0.92">Lease expiry -&gt; re-claim -&gt; safe resume is the crash-recovery backbone.</text><text x="840" y="850.4" font-size="12.4" fill="#186547" fill-opacity="0.92">Claim is a transactional optimistic update: exactly one worker wins.</text><text x="840" y="868.8" font-size="12.4" fill="#186547" fill-opacity="0.92">DB unavailable? claims fail closed - work pauses, never double-owned.</text><text x="840" y="887.1999999999999" font-size="12.4" fill="#186547" fill-opacity="0.92">Six ports pinned by vectors.json; ~3,000 tasks/s, p99 ~34ms (reference).</text><text x="800.0" y="932" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/flowforge</text></svg>