# FlowForge local stack: the engine plus a multi-language worker fleet, all speaking
# the same contract. Bring it up with:
#
#     docker compose -f infrastructure/docker-compose.yml up --build
#
# Then open the operator console (see ui/) and submit a workflow; the workers - written
# in different languages - are interchangeable and will drain it together.
#
# Redpanda (a Kafka-API log) and Postgres are included as the durable backbone the
# engine targets in production; the reference engine runs its in-memory store by
# default so the stack comes up with zero external setup. See architecture/ADR/001.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: ..
      dockerfile: infrastructure/engine.Dockerfile
    environment:
      FLOWFORGE_ADDR: ":8080"
      FLOWFORGE_LEASE_SECONDS: "30"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker-go:
    build:
      context: ..
      dockerfile: infrastructure/worker-go.Dockerfile
    environment:
      FLOWFORGE_ENGINE: "http://engine:8080"
      FLOWFORGE_WORKER: "worker-go"
    depends_on:
      - engine

  worker-python:
    build:
      context: ..
      dockerfile: infrastructure/worker-python.Dockerfile
    environment:
      FLOWFORGE_ENGINE: "http://engine:8080"
      FLOWFORGE_WORKER: "worker-python"
    depends_on:
      - engine
